[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchquantlib"
version = "1.3.2"
description = "High-Performance PyTorch Library for Derivatives Pricing"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jialue Chen", email = "jialuechen@outlook.com" },
]
keywords = ["quantitative finance", "derivatives", "pytorch", "option pricing", "risk management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch",
  "numpy",
  "scipy",
  "geomloss",
  "pytest>=7.4.4",
]

[project.optional-dependencies]
docs = ["sphinx", "sphinx_rtd_theme"]
test = ["pytest"]
dev = ["pytest", "sphinx", "sphinx_rtd_theme"]

[project.urls]
Homepage = "https://github.com/jialuechen/torchquantlib"
Documentation = "https://torchquant.readthedocs.io/en/stable/"
Repository = "https://github.com/jialuechen/torchquantlib"

[tool.setuptools.packages.find]
include = ["torchquantlib*"]
