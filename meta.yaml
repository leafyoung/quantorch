package:
  name: torchquantlib
  version: 1.3.2

source:
  path: .

build:
  number: 0
  script: python -m pip install . --no-deps --ignore-installed -vv

requirements:
  build:
    - python
    - pip
    - setuptools

  run:
    - python

test:
  imports:
    - torchquantlib

about:
  home: https://github.com/jialuechen/torchquantlib
  license: Apache License 2.0
